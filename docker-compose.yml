version: '3.8'

services:
  app:
    build: .
    ports:
      - "9919:9919"
    volumes:
      - ./backend/hub.db:/app/backend/hub.db
      - ./backend/static:/app/backend/static
      - ./downloads:/app/backend/library/media_downloader
    env_file:
      - ./backend/.env
    environment:
      - PORT=9919
      - ALLOW_REGISTRATION=false
      - SECRET_KEY=your_secure_random_production_secret_here
    restart: unless-stopped
