<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hub</title>
      <script>
      try {
        const cached = localStorage.getItem('cached_user');
        let mode = 'system';
        let theme = 'default';
        if (cached) {
          const user = JSON.parse(cached);
          if (user && user.preferences) {
            mode = user.preferences.mode || mode;
            theme = user.preferences.theme || theme;
          }
        }
        if (mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
          document.documentElement.classList.remove('light');
        } else {
          document.documentElement.classList.add('light');
          document.documentElement.classList.remove('dark');
        }
        document.documentElement.setAttribute('data-theme', theme);
        
        let metaThemeColor = document.querySelector("meta[name=theme-color]");
        if (!metaThemeColor) {
          metaThemeColor = document.createElement("meta");
          metaThemeColor.name = "theme-color";
          document.head.appendChild(metaThemeColor);
        }
        if (document.documentElement.classList.contains('dark')) {
          metaThemeColor.content = theme === 'amoled' ? '#000000' : '#111827';
        } else {
          metaThemeColor.content = '#f9fafb';
        }

        // Keep it strictly synced with future React changes to class/theme
        const observer = new MutationObserver(() => {
          const isDark = document.documentElement.classList.contains('dark');
          const currentTheme = document.documentElement.getAttribute('data-theme');
          metaThemeColor.content = isDark ? (currentTheme === 'amoled' ? '#000000' : '#111827') : '#f9fafb';
        });
        observer.observe(document.documentElement, { attributes: true, attributeFilter: ['class', 'data-theme'] });
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
